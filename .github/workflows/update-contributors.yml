name: "Update contributors"

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/update-contributors.yml"
      - "contrib/tools/generate-contributors/**"
      - "package.json"
      - "package-lock.json"
      - "README.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'scheduled-update' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: "Validate contributor generator"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v5"
        with:
          fetch-depth: 0

      - name: "Setup NodeJS"
        uses: "actions/setup-node@v3"
        with:
          node-version: 24
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci --workspace=@workadventure/generate-contributors

      - name: "Typecheck"
        run: npm run typecheck --workspace=@workadventure/generate-contributors

      - name: "Test"
        run: npm test --workspace=@workadventure/generate-contributors

  update:
    if: github.event_name != 'pull_request'
    name: "Update contributor list"
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v5"
        with:
          fetch-depth: 0

      - name: "Setup NodeJS"
        uses: "actions/setup-node@v3"
        with:
          node-version: 24
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci --workspace=@workadventure/generate-contributors

      - name: "Typecheck"
        run: npm run typecheck --workspace=@workadventure/generate-contributors

      - name: "Test"
        run: npm test --workspace=@workadventure/generate-contributors

      - name: "Generate contributor list"
        run: npm run generate-contributors
        env:
          GH_TOKEN: ${{ github.token }}

      - name: "Create update pull request"
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/update-contributors
          delete-branch: true
          commit-message: "docs: update contributors"
          title: "docs: update contributors"
          body: |
            Automated update of the contributor avatar list.

            Generated from the repository contribution history by the weekly contributors workflow.
